<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

   

        <h1>Rock Paper scissors</h1>

        <section class="winner-display" id="winner">
            <div id="matchup"></div>
            <div id="player"></div>
            <div id="computer"></div>
        </section>
        <section class="rps-container">

            <div class="rps-item" id="rock">
                <div class="item-title">Rock</div>
                <img src="img/Rock.png" alt="">
            </div>

            <div class="rps-item" id="paper">
                <div class="item-title">Paper</div>
                <img src="img/paper.png" alt="">
            </div>

            <div class="rps-item" id="scissors">

                <div class="item-title">Scissors</div>
                <img src="img/scissors.png" alt="">
            </div>

        </section>

    





    <script type="module" src="/script.js"></script>
</body>

</html>
